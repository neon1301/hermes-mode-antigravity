<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="hermes-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background container (crisp contrast on light and dark themes) -->
  <rect width="128" height="128" rx="32" fill="#0f172a"/>
  <!-- Winged Helmet / Hermes Emblem -->
  <path d="M32 56 C32 36, 96 36, 96 56 C96 76, 80 92, 64 96 C48 92, 32 76, 32 56 Z" fill="url(#hermes-grad)" opacity="0.9"/>
  <!-- Left wing -->
  <path d="M36 48 C20 40, 12 24, 20 16 C28 28, 36 36, 44 44 Z" fill="#38bdf8"/>
  <path d="M38 56 C22 52, 16 40, 22 32 C30 40, 36 48, 42 52 Z" fill="#60a5fa"/>
  <!-- Right wing -->
  <path d="M92 48 C108 40, 116 24, 108 16 C100 28, 92 36, 84 44 Z" fill="#a855f7"/>
  <path d="M90 56 C106 52, 112 40, 106 32 C98 40, 92 48, 86 52 Z" fill="#c084fc"/>
  <!-- Central visor / beacon -->
  <circle cx="64" cy="60" r="10" fill="#ffffff"/>
  <!-- Nodes network / agents connections -->
  <circle cx="48" cy="108" r="6" fill="#38bdf8"/>
  <circle cx="64" cy="112" r="7" fill="#818cf8"/>
  <circle cx="80" cy="108" r="6" fill="#c084fc"/>
  <line x1="48" y1="108" x2="64" y2="96" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="64" y1="112" x2="64" y2="96" stroke="#818cf8" stroke-width="3"/>
  <line x1="80" y1="108" x2="64" y2="96" stroke="#c084fc" stroke-width="3" stroke-dasharray="4 4"/>
</svg>
