name: Hermes Fleet CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON manifests and bundle structure
        run: |
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            const hooks = JSON.parse(fs.readFileSync('hooks.json', 'utf8'));
            if (plugin.name !== 'hermes-fleet' || !plugin.version) throw new Error('Invalid plugin.json');
            if (!hooks['hermes-context-injector'] || !hooks['hermes-clean-edits'] || !hooks['hermes-qa-gate']) {
              throw new Error('Missing required hooks in hooks.json');
            }
            console.log('Manifest & hooks check passed:', { version: plugin.version });
          "

      - name: Run Consistency & Documentation Sync tests
        run: node hooks/consistency.test.mjs

      - name: Run PreInvocation Context Injector tests
        run: node hooks/context-injector.test.mjs

      - name: Run PreToolUse Clean Edits & Zero-Hardcode Guard tests
        run: node hooks/clean-edits-guard.test.mjs

      - name: Run Stop QA & Compliance Gate tests
        run: node hooks/qa-gate.test.mjs
